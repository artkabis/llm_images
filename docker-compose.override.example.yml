# =============================================================
# docker-compose.override.yml — Webcam USB Linux
# =============================================================
# Ce fichier active le passage de la webcam USB au conteneur vidéo.
# Il n'est nécessaire QUE sur Linux avec des caméras USB locales.
#
# Utilisation :
#   cp docker-compose.override.example.yml docker-compose.override.yml
#   Éditer /dev/videoX selon votre configuration (lsusb / v4l2-ctl --list-devices)
#   docker compose up -d
#
# Caméras IP/RTSP : configurer uniquement config/cameras.yml, pas besoin d'override.
# Windows        : utiliser run.py ou scripts/start-dev.ps1 (LOCAL_MODE).
# =============================================================

version: "3.9"

services:
  video:
    devices:
      - /dev/video0:/dev/video0   # Webcam principale
      # - /dev/video2:/dev/video2 # Caméra supplémentaire

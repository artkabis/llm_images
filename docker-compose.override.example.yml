# docker-compose.override.yml — Webcam USB Linux uniquement
#
# Usage :
#   cp docker-compose.override.example.yml docker-compose.override.yml
#   Adapter /dev/videoX selon vos caméras (ls /dev/video*)
#
# NON compatible Windows : les devices /dev/videoX n'existent pas sous Windows.
# Utiliser python run.py (LOCAL_MODE) ou des caméras RTSP pour Docker sur Windows.

services:
  video:
    devices:
      - /dev/video0:/dev/video0
      # Ajouter d'autres caméras USB si nécessaire :
      # - /dev/video2:/dev/video2
      # - /dev/video4:/dev/video4

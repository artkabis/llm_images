name: CI — Facial Recognition System

on:
  push:
    branches: ["claude/facial-recognition-system-bLZRZ", "main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-test-api:
    name: Lint & Tests — API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r services/api/requirements.txt ruff pytest pytest-asyncio httpx

      - name: Lint (ruff)
        run: ruff check services/api/

      - name: Tests unitaires
        run: pytest services/api/tests/ -v --tb=short
        continue-on-error: true  # Pas encore de tests écrits (phase 1)

  lint-test-ml:
    name: Lint & Tests — ML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies (CPU only pour CI)
        run: |
          pip install ruff pytest numpy scipy Pillow
          pip install faiss-cpu insightface onnxruntime

      - name: Lint (ruff)
        run: ruff check services/ml/

  build-docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [lint-test-api, lint-test-ml]
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t facerec-api:ci services/api/

      - name: Build Video image
        run: docker build -t facerec-video:ci services/video/

      - name: Scan sécurité (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "facerec-api:ci"
          format: "table"
          severity: "CRITICAL,HIGH"
        continue-on-error: true

  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: services/frontend/package.json

      - name: Install dependencies
        run: npm install
        working-directory: services/frontend

      - name: Build
        run: npm run build
        working-directory: services/frontend
